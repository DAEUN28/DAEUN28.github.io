{%- if page.comments and site.comments.provider == 'disqus' and site.comments.disqus.shortname -%}
<section class="comments" aria-label="댓글">
  <h2 class="field-title">댓글</h2>
  <div id="disqus_thread"></div>
  <script>
    var disqus_config = function () {
      this.page.url = "{{ page.url | absolute_url }}";
      this.page.identifier = "{{ page.id }}";
    };
    (function() {
      var d = document, s = d.createElement('script');
      s.src = 'https://{{ site.comments.disqus.shortname }}.disqus.com/embed.js';
      s.setAttribute('data-timestamp', +new Date());
      (d.head || d.body).appendChild(s);
    })();
  </script>
  <noscript>댓글을 보려면 JavaScript 를 켜줘. <a href="https://disqus.com/?ref_noscript">Disqus</a>.</noscript>
</section>
{%- endif -%}
