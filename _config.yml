# Site
title: "daeun28 blog"
subtitle: "Swift, iOS, Enjoy😃"
description: "아주 작은 개발자의 블로그"
name: "DAEUN28"
locale: "ko-KR"
url: "https://DAEUN28.github.io"
baseurl: ""
repository: "DAEUN28/DAEUN28.github.io"
timezone: "Asia/Seoul"

author:
  name: "DAEUN28"
  email: "acone1128@gmail.com"

# Comments (Disqus)
comments:
  provider: "disqus"
  disqus:
    shortname: "daeun28"

# Analytics (Google gtag)
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "UA-151187861-1"
    anonymize_ip: true

# Archives
category_archive:
  path: /categories/
tag_archive:
  path: /tags/

# Reading
include:
  - _pages
exclude:
  - _editor
  - README.md
  - LICENSE
  - staticman.yml
  - Example
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - Gemfile
  - Gemfile.lock
keep_files:
  - .git
  - wiki     # Built by the wiki Action; Jekyll must never touch or remove it.
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge

# Markdown processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Outputting
permalink: /:categories/:title/
paginate: 10
paginate_path: /page:num/

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap

# Front-matter defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page
