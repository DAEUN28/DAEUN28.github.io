name: Build wiki

on:
  push:
    branches: [wiki]
    paths:
      - '_editor/content/**'
      - '_editor/user-images/**'
      - '_editor/config/**'
      - '_editor/wikiwikiwiki/**'
      - '_editor/themes/**'
      - '_editor/tools/**'
      - '.github/workflows/build-wiki.yml'
  workflow_dispatch:

concurrency:
  group: build-wiki
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wiki branch
        uses: actions/checkout@v4
        with:
          ref: wiki
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "wiki-bot"
          git config user.email "wiki-bot@users.noreply.github.com"

      - name: Merge master into wiki
        run: |
          git fetch origin master
          # Each successful run ends with wiki force-reset to master, so the
          # typical case is a no-op merge. If a direct push to master lands
          # in between, -X ours keeps wiki's edited sources authoritative
          # when the file paths collide (squash-to-master creates add/add
          # conflicts without this).
          git merge origin/master --no-edit -X ours -m "wiki: pull master updates" || {
            echo "merge conflict detected; aborting"
            git merge --abort || true
            exit 1
          }

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Prepare engine runtime dirs
        working-directory: _editor
        run: |
          mkdir -p users cache history cache/sessions
          php tools/ci-seed-user.php

      - name: Start engine
        working-directory: _editor
        run: |
          php -S 127.0.0.1:3333 -t . tools/ci-router.php >/tmp/engine.log 2>&1 &
          echo $! > /tmp/engine.pid
          # Wait for the engine to answer /api/all.
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3333/api/all > /dev/null; then
              echo "engine ready"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3333/api/all || {
            echo "engine failed to start"
            cat /tmp/engine.log
            exit 1
          }

      - name: Export static /wiki/
        env:
          WIKI_EXPORT_DEST: ${{ github.workspace }}/_editor/public
        run: |
          python3 _editor/tools/export.py

      - name: Stop engine
        if: always()
        run: |
          [ -f /tmp/engine.pid ] && kill "$(cat /tmp/engine.pid)" || true

      - name: Sync /wiki at repo root
        run: |
          rsync -a --delete _editor/public/wiki/ wiki/

      - name: Commit wiki changes on this branch
        id: commit
        run: |
          git add wiki/
          if git diff --cached --quiet; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            echo "no wiki/ changes"
          else
            git commit -m "wiki build: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "no_changes=false" >> "$GITHUB_OUTPUT"
          fi
          git push origin wiki

      - name: Squash into master
        if: steps.commit.outputs.no_changes == 'false'
        run: |
          git fetch origin master
          git checkout master
          # Fold the editor's "edit via wiki-editor:" + the merge-master + the
          # wiki build commit on the wiki branch into a single tidy commit on
          # master so `git log master` stays readable.
          git merge --squash wiki
          # Prefer the editor's own message when we can find it; otherwise
          # stamp a generic one.
          MSG=$(git log wiki -40 --format='%s' | grep -m1 -E '^(edit|upload) via wiki-editor:' | sed -E 's/^edit via wiki-editor: /content: /; s/^upload via wiki-editor: /image: /') || true
          git commit -m "${MSG:-content update}" || echo "nothing to commit"
          git push origin master

      - name: Reset wiki to match master
        if: steps.commit.outputs.no_changes == 'false'
        run: |
          # Point wiki at master's new tip so the next run merges nothing
          # and no add/add conflicts build up from the squash. Works because
          # wiki never holds content master doesn't — the squash just folded
          # the full delta in.
          git push origin master:wiki --force-with-lease=wiki
